<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pase de Lista QR</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

/* ==================================================
   CONFIGURACIÓN GENERAL
   ================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f2f4f7;

    color: #222;

    overflow-x: hidden;
}


/* ==================================================
   CONTENEDOR PRINCIPAL
   ================================================== */

.contenedor {

    width: 100%;

    max-width: 600px;

    margin: 0 auto;

    padding:
        12px
        max(12px, env(safe-area-inset-right))
        20px
        max(12px, env(safe-area-inset-left));
}


/* ==================================================
   ENCABEZADO
   ================================================== */

.titulo {

    width: 100%;

    background: white;

    padding: 16px;

    border-radius: 18px;

    text-align: center;

    margin-bottom: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.10);
}

.titulo h1 {

    margin: 0;

    font-size: clamp(24px, 7vw, 34px);

}

.titulo p {

    margin: 8px 0 0;

    font-size: clamp(14px, 4vw, 18px);

    color: #666;

}


/* ==================================================
   ESCÁNER
   ================================================== */

#reader {

    width: 80% !important;

    max-width: 100% !important;

    background: white;

    padding: 8px;

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 3px 12px rgba(0,0,0,.10);

}


/* El video se adapta al celular */

#reader video {

    width: 100% !important;

    max-width: 100% !important;

    height: auto !important;

    object-fit: cover;

    border-radius: 12px;

}


/* Imagen del QR */

#reader img {

    max-width: 100%;

}


/* ==================================================
   SELECTOR DE CÁMARA
   ================================================== */

#reader select {

    width: 100%;

    min-height: 48px;

    margin-top: 8px;

    padding: 10px;

    font-size: 16px;

    border-radius: 10px;

    border: 1px solid #ccc;

    background: white;

}


/* ==================================================
   BOTONES
   ================================================== */

#reader button {

    width: 100%;

    min-height: 48px;

    margin-top: 8px;

    padding: 12px;

    font-size: 17px;

    font-weight: 600;

    border-radius: 12px;

    border: none;

    cursor: pointer;

}


/* ==================================================
   RESULTADO
   ================================================== */

.resultado {

    width: 100%;

    margin-top: 12px;

    padding: 18px;

    background: white;

    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 3px 12px rgba(0,0,0,.10);

    transition: .2s;

}


.icono {

    font-size: clamp(38px, 12vw, 60px);

    line-height: 1;

    margin-bottom: 8px;

}


.nombre {

    font-size: clamp(22px, 7vw, 30px);

    font-weight: bold;

    margin: 8px 0;

    word-break: break-word;

}


.id {

    font-size: clamp(15px, 4vw, 19px);

}


.hora {

    font-size: clamp(15px, 4vw, 19px);

    margin-top: 8px;

}


/* ==================================================
   ESTADOS
   ================================================== */

.exito {

    background: #dff6e5;

    border: 2px solid #28a745;

}


.duplicado {

    background: #fff3cd;

    border: 2px solid #ffc107;

}


.error {

    background: #f8d7da;

    border: 2px solid #dc3545;

}


/* ==================================================
   TABLETS
   ================================================== */

@media (min-width: 601px) {

    .contenedor {

        padding-top: 25px;

    }

    #reader {

        padding: 12px;

    }

}


/* ==================================================
   CELULARES PEQUEÑOS
   ================================================== */

@media (max-width: 380px) {

    .contenedor {

        padding: 8px;

    }

    .titulo {

        padding: 12px;

        border-radius: 14px;

    }

    .resultado {

        padding: 14px;

        border-radius: 14px;

    }

}


/* ==================================================
   CELULAR EN HORIZONTAL
   ================================================== */

@media (orientation: landscape)
and (max-height: 500px) {

    .contenedor {

        max-width: 900px;

    }

    .titulo {

        padding: 10px;

        margin-bottom: 8px;

    }

    .titulo h1 {

        font-size: 24px;

    }

    .titulo p {

        margin: 4px 0 0;

    }

    .resultado {

        padding: 10px;

    }

}


/* ==================================================
   IPHONE CON NOTCH / SAFE AREA
   ================================================== */

@supports (padding: env(safe-area-inset-top)) {

    .contenedor {

        padding-top:
            max(12px, env(safe-area-inset-top));

        padding-bottom:
            max(20px, env(safe-area-inset-bottom));

    }

}

</style>

</head>


<body>


<div class="contenedor">


    <!-- ==========================================
         ENCABEZADO
         ========================================== -->

    <div class="titulo">

        <h1>📋 Pase de Lista</h1>

        <p>
            Escanea el código QR del invitado
        </p>

    </div>


    <!-- ==========================================
         ESCÁNER
         ========================================== -->

    <div id="reader"></div>


    <!-- ==========================================
         RESULTADO
         ========================================== -->

    <div id="resultado"
         class="resultado">

        <div class="icono">
            📷
        </div>

        <div>
            Esperando código QR...
        </div>

    </div>


</div>


<script>


// ==================================================
// URL DE GOOGLE APPS SCRIPT
// ==================================================

const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbwnawq96p0uGO0uR9CN7UsU_JUCf2PhUtWcCSF6Mb2RVVnHVAfwJOKTPpZ0UqJmfTZ46w/exec';


// ==================================================
// CONTROL PARA EVITAR DOBLE ESCANEO
// ==================================================

let procesando = false;


// ==================================================
// QR DETECTADO
// ==================================================

function qrEncontrado(texto) {


    if (procesando) {

        return;

    }


    procesando = true;


    mostrarProcesando();


    // ----------------------------------------------
    // BUSCAR ID EN EL QR
    // ----------------------------------------------

    const coincidencia =
        texto.match(
            /ID\s*:\s*([^\s\r\n]+)/i
        );


    if (!coincidencia) {

        mostrarError(
            'El QR no contiene un ID válido'
        );

        procesando = false;

        return;

    }


    const id =
        coincidencia[1].trim();


    // ----------------------------------------------
    // ENVIAR A APPS SCRIPT
    // ----------------------------------------------

    const url =
        APPS_SCRIPT_URL +
        '?id=' +
        encodeURIComponent(id);


    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    'Error HTTP'
                );

            }

            return response.json();

        })

        .then(data => {

            mostrarResultado(data);


            setTimeout(() => {

                procesando = false;

            }, 1500);

        })

        .catch(error => {

            console.error(error);


            mostrarError(
                'No se pudo conectar con el servidor'
            );


            procesando = false;

        });

}


// ==================================================
// MOSTRAR RESULTADO
// ==================================================

function mostrarResultado(data) {


    const caja =
        document.getElementById(
            'resultado'
        );


    if (data.ok) {


        caja.className =
            'resultado exito';


        caja.innerHTML = `

            <div class="icono">
                ✅
            </div>

            <div>
                ASISTENCIA REGISTRADA
            </div>

            <div class="nombre">
                ${escapar(data.nombre)}
            </div>

            <div class="id">
                ID: ${escapar(data.id)}
            </div>

            <div class="hora">
                🕐 ${escapar(data.hora)}
            </div>

        `;


        // Vibración en Android

        if (
            navigator.vibrate
        ) {

            navigator.vibrate(200);

        }


        return;

    }


    if (
        data.tipo ===
        'DUPLICADO'
    ) {


        caja.className =
            'resultado duplicado';


        caja.innerHTML = `

            <div class="icono">
                ⚠️
            </div>

            <div>
                YA REGISTRADO
            </div>

            <div class="nombre">
                ${escapar(data.nombre)}
            </div>

            <div class="id">
                ID: ${escapar(data.id)}
            </div>

            <div class="hora">
                Registro:
                ${escapar(data.hora)}
            </div>

        `;


        if (
            navigator.vibrate
        ) {

            navigator.vibrate(
                [100, 100, 100]
            );

        }


        return;

    }


    caja.className =
        'resultado error';


    caja.innerHTML = `

        <div class="icono">
            ❌
        </div>

        <div>
            ${escapar(data.mensaje)}
        </div>

        ${
            data.id
            ?
            `
            <div class="id">
                ID:
                ${escapar(data.id)}
            </div>
            `
            :
            ''
        }

    `;

}


// ==================================================
// PROCESANDO
// ==================================================

function mostrarProcesando() {


    const caja =
        document.getElementById(
            'resultado'
        );


    caja.className =
        'resultado';


    caja.innerHTML = `

        <div class="icono">
            ⏳
        </div>

        <div>
            Registrando asistencia...
        </div>

    `;

}


// ==================================================
// ERROR
// ==================================================

function mostrarError(mensaje) {


    const caja =
        document.getElementById(
            'resultado'
        );


    caja.className =
        'resultado error';


    caja.innerHTML = `

        <div class="icono">
            ❌
        </div>

        <div>
            ${escapar(mensaje)}
        </div>

    `;

}


// ==================================================
// PROTECCIÓN HTML
// ==================================================

function escapar(texto) {


    if (
        texto === null ||
        texto === undefined
    ) {

        return '';

    }


    return String(texto)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


// ==================================================
// INICIAR ESCÁNER
// ==================================================

function iniciarScanner() {


    const scanner =
        new Html5QrcodeScanner(

            'reader',

            {

                fps: 10,

                qrbox: function(
                    viewfinderWidth,
                    viewfinderHeight
                ) {

                    const size =
                        Math.min(
                            viewfinderWidth,
                            viewfinderHeight
                        ) * 0.60;

                    return {
                        width: Math.floor(size),
                        height: Math.floor(size)
                    };

                },

                rememberLastUsedCamera: true,

                aspectRatio: 1.0

            },

            false

        );


    scanner.render(

        qrEncontrado,

        function(error) {

            // No mostramos los errores
            // normales mientras busca QR

        }

    );

}


// ==================================================
// INICIAR
// ==================================================

iniciarScanner();


</script>


</body>

</html>
