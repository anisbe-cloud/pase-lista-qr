<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pase de lista</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
      color: #6b1f5b;
      font-size: 27px;
    }

    .subtitulo {
      margin-top: 0;
      margin-bottom: 22px;
      text-align: center;
      color: #666;
      font-size: 15px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #444;
    }

    select,
    button {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      font-size: 15px;
    }

    select {
      background: white;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-iniciar {
      margin-top: 20px;
      background: #6b1f5b;
      color: white;
    }

    .btn-iniciar:hover {
      background: #511744;
    }

    .btn-detener {
      margin-top: 12px;
      background: #777;
      color: white;
      display: none;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 22px auto 0;
      display: none;
      overflow: hidden;
      border-radius: 12px;
    }

    .instrucciones {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1e8f0;
      color: #6b1f5b;
      text-align: center;
      font-size: 14px;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

    #resultado.exito {
      display: block;
      background: #e4f7e9;
      border: 1px solid #8bd19a;
      color: #176b2b;
    }

    #resultado.error {
      display: block;
      background: #fde8e8;
      border: 1px solid #e5a1a1;
      color: #9a1c1c;
    }

    #resultado.aviso {
      display: block;
      background: #fff5d9;
      border: 1px solid #e5c36a;
      color: #765500;
    }

    .dato {
      margin: 5px 0;
    }

    .dato strong {
      font-weight: bold;
    }

    .cargando {
      text-align: center;
      color: #666;
      margin-top: 15px;
      display: none;
    }

    .seleccion {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f7f7f7;
      font-size: 14px;
      color: #555;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .contenedor {
        padding: 17px;
        border-radius: 12px;
      }

      h1 {
        font-size: 23px;
      }

      select,
      button {
        font-size: 14px;
      }

      #reader {
        max-width: 310px;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Pase de lista</h1>

    <p class="subtitulo">
      Selecciona el día y la actividad antes de escanear el código QR.
    </p>

    <label for="dia">Día de la actividad</label>

    <select id="dia" onchange="cargarActividades()">
      <option value="">Selecciona un día</option>
      <option value="Día 1 · 28 de septiembre">
        Día 1 · 28 de septiembre
      </option>
      <option value="Día 2 · 29 de septiembre">
        Día 2 · 29 de septiembre
      </option>
    </select>

    <label for="actividad">Actividad</label>

    <select id="actividad" disabled>
      <option value="">Primero selecciona un día</option>
    </select>

    <div id="seleccion" class="seleccion" style="display:none;"></div>

    <button
      id="btnIniciar"
      class="btn-iniciar"
      onclick="iniciarEscaner()">
      Iniciar escáner
    </button>

    <button
      id="btnDetener"
      class="btn-detener"
      onclick="detenerEscaner()">
      Detener escáner
    </button>

    <div id="instrucciones" class="instrucciones">
      Coloca el código QR dentro del recuadro.
    </div>

    <div id="reader"></div>

    <div id="cargando" class="cargando">
      Registrando asistencia...
    </div>

    <div id="resultado"></div>

  </div>

  <script>
    /*
     * Reemplaza esta URL por la URL de tu aplicación web de Apps Script.
     */
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxST6tPkm9fQX0czbTWW4Qpu3UOsqOm3pink7L-hye9ySByrvIRxjPtwMGcHCpzO6kzWw/exec';


    /*
     * Actividades reales del congreso.
     */
    const actividades = {

      'Día 1 · 28 de septiembre': [
        '09:30 Ponencia Magistral: Trauma, cuidados colectivos y reparación feminista frente a las violencias sexuales. Creer y cuidar a quien sostiene la vida',

        '11:30 Taller 1: Recursos feministas para afrontar las violencias sexuales contra niñeces y adolescencias.',

        '11:30 Taller 2: Recursos legales para profesionales. Herramientas desde el territorio. Experiencias de México y Argentina.',

        '11:30 Panel sobre violencias sexuales digitales y desafíos en entornos digitales'
      ],

      'Día 2 · 29 de septiembre': [
        '09:15 Conferencia Magistral: Modelos de caridad vs modelos de justicia social: tensiones en el manejo de financiamiento en organizaciones sin fines de lucro.',

        '11:30 Conferencia interactiva: Recursos legales feministas en procesos de violencias sexuales para personas cuidadoras.',

        '11:30 Taller: Educación integral de las sexualidades como factor de protección.',

        '13:30 Ponencia Magistral de Cierre: Resistir y reinventarse: desafíos actuales y futuros de la cooperación internacional en América Latina y el Caribe.'
      ]

    };


    let html5QrCode = null;
    let escaneando = false;
    let procesando = false;


    /*
     * Cargar actividades según el día seleccionado.
     */
    function cargarActividades() {

      const dia =
        document.getElementById('dia').value;

      const selectActividad =
        document.getElementById('actividad');

      const seleccion =
        document.getElementById('seleccion');

      selectActividad.innerHTML = '';

      seleccion.style.display = 'none';

      if (!dia) {

        selectActividad.disabled = true;

        const opcion =
          document.createElement('option');

        opcion.value = '';
        opcion.textContent =
          'Primero selecciona un día';

        selectActividad.appendChild(opcion);

        return;
      }

      selectActividad.disabled = false;

      const opcionInicial =
        document.createElement('option');

      opcionInicial.value = '';
      opcionInicial.textContent =
        'Selecciona una actividad';

      selectActividad.appendChild(opcionInicial);

      actividades[dia].forEach(function(actividad) {

        const opcion =
          document.createElement('option');

        opcion.value = actividad;
        opcion.textContent = actividad;

        selectActividad.appendChild(opcion);

      });

      selectActividad.onchange = mostrarSeleccion;
    }


    /*
     * Mostrar la selección actual.
     */
    function mostrarSeleccion() {

      const dia =
        document.getElementById('dia').value;

      const actividad =
        document.getElementById('actividad').value;

      const seleccion =
        document.getElementById('seleccion');

      if (!dia || !actividad) {

        seleccion.style.display = 'none';

        return;
      }

      seleccion.innerHTML =
        '<strong>Día:</strong> ' +
        escaparHTML(dia) +
        '<br><strong>Actividad:</strong> ' +
        escaparHTML(actividad);

      seleccion.style.display = 'block';
    }


    /*
     * Iniciar escáner.
     */
    async function iniciarEscaner() {

      const dia =
        document.getElementById('dia').value;

      const actividad =
        document.getElementById('actividad').value;

      if (!dia) {
        mostrarResultado(
          'Selecciona el día de la actividad.',
          'aviso'
        );
        return;
      }

      if (!actividad) {
        mostrarResultado(
          'Selecciona la actividad antes de iniciar el escáner.',
          'aviso'
        );
        return;
      }

      if (escaneando) {
        return;
      }

      document.getElementById('reader').style.display = 'block';

      document.getElementById('instrucciones').style.display =
        'block';

      document.getElementById('btnIniciar').style.display =
        'none';

      document.getElementById('btnDetener').style.display =
        'block';

      limpiarResultado();

      html5QrCode =
        new Html5Qrcode('reader');

      escaneando = true;

      try {

        await html5QrCode.start(
          {
            facingMode: 'environment'
          },
          {
            fps: 10,
            qrbox: {
              width: 230,
              height: 230
            },
            aspectRatio: 1.0
          },
          qrEncontrado,
          function(errorMessage) {
            // No mostrar errores momentáneos de lectura.
          }
        );

      } catch (error) {

        escaneando = false;

        document.getElementById('reader').style.display =
          'none';

        document.getElementById('instrucciones').style.display =
          'none';

        document.getElementById('btnIniciar').style.display =
          'block';

        document.getElementById('btnDetener').style.display =
          'none';

        mostrarResultado(
          'No fue posible abrir la cámara. Verifica los permisos del navegador.',
          'error'
        );

        console.error(error);
      }
    }


    /*
     * Detener escáner.
     */
    async function detenerEscaner() {

      if (html5QrCode && escaneando) {

        try {
          await html5QrCode.stop();
        } catch (error) {
          console.error(error);
        }

      }

      escaneando = false;

      document.getElementById('reader').style.display =
        'none';

      document.getElementById('instrucciones').style.display =
        'none';

      document.getElementById('btnIniciar').style.display =
        'block';

      document.getElementById('btnDetener').style.display =
        'none';
    }


    /*
     * Se ejecuta cuando se detecta un código QR.
     */
    async function qrEncontrado(texto) {

      if (procesando) {
        return;
      }

      procesando = true;

      const id = extraerID(texto);

      if (!id) {

        mostrarResultado(
          'El código QR no contiene un folio válido.',
          'error'
        );

        procesando = false;

        return;
      }

      const dia =
        document.getElementById('dia').value;

      const actividad =
        document.getElementById('actividad').value;

      await detenerEscaner();

      registrarAsistencia(id, dia, actividad);
    }


    /*
     * Extraer el folio del QR.
     *
     * Acepta:
     * ID: YTC-004
     * id=YTC-004
     * YTC-004
     */
    function extraerID(texto) {

      const contenido =
        String(texto || '').trim();

      let coincidencia =
        contenido.match(
          /ID\s*:\s*([A-Za-z0-9_-]+)/i
        );

      if (coincidencia) {
        return coincidencia[1].trim();
      }

      coincidencia =
        contenido.match(
          /id\s*=\s*([A-Za-z0-9_-]+)/i
        );

      if (coincidencia) {
        return coincidencia[1].trim();
      }

      if (
        /^[A-Za-z0-9_-]+$/.test(contenido)
      ) {
        return contenido;
      }

      return '';
    }


    /*
     * Enviar asistencia al Apps Script.
     */
    async function registrarAsistencia(
      id,
      dia,
      actividad
    ) {

      const cargando =
        document.getElementById('cargando');

      cargando.style.display = 'block';

      try {

        const url =
          APPS_SCRIPT_URL +
          '?id=' + encodeURIComponent(id) +
          '&dia=' + encodeURIComponent(dia) +
          '&actividad=' + encodeURIComponent(actividad);

        const respuesta =
          await fetch(url);

        const datos =
          await respuesta.json();

        cargando.style.display = 'none';

        if (datos.ok) {

          mostrarResultado(
            '<div class="dato"><strong>Asistencia registrada</strong></div>' +
            '<div class="dato"><strong>Folio:</strong> ' +
            escaparHTML(datos.id) +
            '</div>' +
            '<div class="dato"><strong>Nombre:</strong> ' +
            escaparHTML(datos.nombre) +
            '</div>' +
            '<div class="dato"><strong>Día:</strong> ' +
            escaparHTML(datos.dia) +
            '</div>' +
            '<div class="dato"><strong>Actividad:</strong> ' +
            escaparHTML(datos.actividad) +
            '</div>' +
            '<div class="dato"><strong>Hora:</strong> ' +
            escaparHTML(datos.hora) +
            '</div>',
            'exito'
          );

        } else if (datos.tipo === 'DUPLICADO') {

          mostrarResultado(
            '<div class="dato"><strong>Asistencia duplicada</strong></div>' +
            '<div class="dato">' +
            escaparHTML(datos.mensaje) +
            '</div>' +
            '<div class="dato"><strong>Nombre:</strong> ' +
            escaparHTML(datos.nombre || '') +
            '</div>' +
            '<div class="dato"><strong>Actividad:</strong> ' +
            escaparHTML(datos.actividad || '') +
            '</div>',
            'aviso'
          );

        } else {

          mostrarResultado(
            '<div class="dato"><strong>No se registró la asistencia</strong></div>' +
            '<div class="dato">' +
            escaparHTML(datos.mensaje || 'Ocurrió un error') +
            '</div>' +
            '<div class="dato"><strong>Nombre:</strong> ' +
            escaparHTML(datos.nombre || '') +
            '</div>',
            'error'
          );

        }

      } catch (error) {

        cargando.style.display = 'none';

        mostrarResultado(
          'No fue posible comunicarse con el servidor. Verifica tu conexión a internet.',
          'error'
        );

        console.error(error);

      } finally {

        procesando = false;

      }
    }


    /*
     * Mostrar resultado.
     */
    function mostrarResultado(
      contenido,
      tipo
    ) {

      const resultado =
        document.getElementById('resultado');

      resultado.innerHTML = contenido;

      resultado.className = tipo;

      resultado.style.display = 'block';
    }


    /*
     * Limpiar resultado.
     */
    function limpiarResultado() {

      const resultado =
        document.getElementById('resultado');

      resultado.innerHTML = '';

      resultado.className = '';

      resultado.style.display = 'none';
    }


    /*
     * Evitar insertar texto no confiable como HTML.
     */
    function escaparHTML(texto) {

      return String(texto || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

  </script>

</body>
</html>
